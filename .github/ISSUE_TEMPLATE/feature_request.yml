name: 💡 Feature request
description: Suggest an idea or improvement.
title: "[Idea] "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
      description: Describe the situation, not only the solution — it helps find the best fix.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would you like to happen?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Anything you've tried or considered instead?
  - type: checkboxes
    id: help
    attributes:
      label: Contributing
      options:
        - label: I'd be interested in helping build this
